name: Security Scans

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: write

jobs:
  security-scan:
    runs-on: ubuntu-latest
    env:
      REPORTS_DIR: project3/Skills_Utilization/security-reports

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # مهم عشان trufflehog يفحص الـ git history كامل

      - name: Create reports directory
        run: mkdir -p "$REPORTS_DIR"

      # ---------- 1) TruffleHog (secrets scanning) ----------
      - name: Run TruffleHog
        id: trufflehog
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD:/repo" trufflesecurity/trufflehog:latest \
            filesystem /repo --json > "$REPORTS_DIR/trufflehog-report.txt" 2>&1 || true
          echo "TruffleHog step finished with exit status: $?"

      # ---------- 2) Hadolint (Dockerfile linting) ----------
      - name: Run Hadolint
        id: hadolint
        continue-on-error: true
        run: |
          docker run --rm -i hadolint/hadolint \
            < project3/Skills_Utilization/dockerfile \
            > "$REPORTS_DIR/hadolint-report.txt" 2>&1 || true
          echo "Hadolint step finished with exit status: $?"

      # ---------- 3) Bandit (Python security linting) ----------
      - name: Run Bandit
        id: bandit
        continue-on-error: true
        run: |
          pip install bandit --quiet --break-system-packages || true
          bandit -r project3/Skills_Utilization -f txt \
            > "$REPORTS_DIR/bandit-report.txt" 2>&1 || true
          echo "Bandit step finished with exit status: $?"

      # ---------- طباعة ملخص على الـ terminal ----------
      - name: Print summary
        if: always()
        run: |
          echo "===================== SECURITY SCAN SUMMARY ====================="
          echo "--- TruffleHog ---"; cat "$REPORTS_DIR/trufflehog-report.txt" 2>/dev/null || echo "no report"
          echo "--- Hadolint ---";   cat "$REPORTS_DIR/hadolint-report.txt"   2>/dev/null || echo "no report"
          echo "--- Bandit ---";     cat "$REPORTS_DIR/bandit-report.txt"     2>/dev/null || echo "no report"
          echo "==================================================================="

      # ---------- Commit الملفات بشكل دائم داخل project3/Skills_Utilization ----------
      - name: Commit security reports
        if: always() && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$REPORTS_DIR"
          git diff --cached --quiet || git commit -m "chore: update security scan reports [skip ci]"
          git pull --rebase origin main
          git push

      # ---------- رفع الملفات كـ artifact كمان (نسخة احتياطية سريعة) ----------
      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: ${{ env.REPORTS_DIR }}/
          retention-days: 14
