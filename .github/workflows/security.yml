name: Security Scans

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: write

jobs:
  security-scan:
    runs-on: ubuntu-latest
    env:
      REPORTS_DIR: project3/Skills_Utilization/security-reports

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # مهم عشان trufflehog يفحص الـ git history كامل

      - name: Create reports directories
        run: |
          mkdir -p "$REPORTS_DIR/trufflehog"
          mkdir -p "$REPORTS_DIR/hadolint"
          mkdir -p "$REPORTS_DIR/bandit"

      # ---------- 1) TruffleHog (secrets scanning) ----------
      - name: Run TruffleHog
        id: trufflehog
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD:/repo" trufflesecurity/trufflehog:latest \
            filesystem /repo --json \
            > "$REPORTS_DIR/trufflehog/output.json" \
            2> "$REPORTS_DIR/trufflehog/error.log" || true

          if [ -s "$REPORTS_DIR/trufflehog/output.json" ]; then
            echo "⚠️ TruffleHog found potential secrets" | tee -a "$REPORTS_DIR/summary.log"
          else
            echo "✅ TruffleHog: no issues" | tee -a "$REPORTS_DIR/summary.log"
          fi

      # ---------- 2) Hadolint (Dockerfile linting) ----------
      - name: Run Hadolint
        id: hadolint
        continue-on-error: true
        run: |
          docker run --rm -i hadolint/hadolint < Dockerfile \
            > "$REPORTS_DIR/hadolint/output.log" \
            2> "$REPORTS_DIR/hadolint/error.log" || true

          if [ -s "$REPORTS_DIR/hadolint/output.log" ]; then
            echo "⚠️ Hadolint found issues in Dockerfile" | tee -a "$REPORTS_DIR/summary.log"
          else
            echo "✅ Hadolint: no issues" | tee -a "$REPORTS_DIR/summary.log"
          fi

      # ---------- 3) Bandit (Python security linting) ----------
      - name: Run Bandit
        id: bandit
        continue-on-error: true
        run: |
          pip install bandit --quiet
          bandit -r . -f txt \
            -o "$REPORTS_DIR/bandit/output.log" \
            2> "$REPORTS_DIR/bandit/error.log" || true

          if [ -s "$REPORTS_DIR/bandit/output.log" ]; then
            echo "⚠️ Bandit found issues" | tee -a "$REPORTS_DIR/summary.log"
          else
            echo "✅ Bandit: no issues" | tee -a "$REPORTS_DIR/summary.log"
          fi

      # ---------- طباعة ملخص كل الأخطاء على الـ terminal ----------
      - name: Print summary
        if: always()
        run: |
          echo "===================== SECURITY SCAN SUMMARY ====================="
          cat "$REPORTS_DIR/summary.log" || echo "no summary generated"
          echo "==================================================================="

      # ---------- Commit الملفات داخل project3/Skills_Utilization بشكل دائم ----------
      - name: Commit security reports
        if: always() && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$REPORTS_DIR"
          git diff --cached --quiet || git commit -m "chore: update security scan reports [skip ci]"
          git push

      # ---------- رفع كل الملفات كـ artifact كمان (نسخة احتياطية سريعة) ----------
      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: ${{ env.REPORTS_DIR }}/
          retention-days: 14
