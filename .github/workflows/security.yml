name: Security Scan

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  security-events: write

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog (secret scanning)
        continue-on-error: true
        run: |
          set +e
          docker run --rm -v "$PWD:/repo" trufflesecurity/trufflehog:latest filesystem /repo --no-update --json > trufflehog-results.json 2>&1
          echo "TruffleHog exit code: $?"
          exit 0

      - name: Run Hadolint (Dockerfile linting)
        continue-on-error: true
        run: |
          set +e
          docker run --rm -i hadolint/hadolint hadolint --format sarif - < ./Skills_Utilization/dockerfile > hadolint-results.sarif 2>&1
          echo "Hadolint exit code: $?"
          exit 0

      - name: Run Bandit (Python security linting)
        continue-on-error: true
        run: |
          set +e
          pip install --quiet bandit bandit-sarif-formatter
          bandit -r ./Skills_Utilization -f sarif -o bandit-results.sarif
          echo "Bandit exit code: $?"
          exit 0

      - name: Upload Hadolint SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: hadolint-results.sarif
          category: hadolint
        continue-on-error: true

      - name: Upload Bandit SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: bandit-results.sarif
          category: bandit
        continue-on-error: true

      - name: Upload raw reports as artifact (backup, includes TruffleHog)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports-raw
          path: |
            trufflehog-results.json
            hadolint-results.sarif
            bandit-results.sarif
