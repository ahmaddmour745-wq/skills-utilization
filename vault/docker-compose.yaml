version: "3.9"

services:
  vault:
    image: hashicorp/vault:1.17
    container_name: vault_server
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    ports:
      - "8200:8200"
    volumes:
      - ./config.hcl:/vault/config/config.hcl
      - ./data:/vault/data
    command: vault server -config=/vault/config/config.hcl
    networks:
      - vault_net

networks:
  vault_net:
    driver: bridge
